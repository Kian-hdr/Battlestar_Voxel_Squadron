name: Native release packages

# Only a maintainer can dispatch this workflow. No PR or workflow_run trigger,
# no release publication token, and no private audio in the ordinary check jobs.
on:
  workflow_dispatch:
    inputs:
      audio:
        description: Embedded audio pack for the native binaries
        required: true
        type: choice
        default: official
        options: [official, public]

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Package ${{ matrix.platform }} x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      CARGO_TERM_COLOR: never
      AUDIO_VARIANT: ${{ inputs.audio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target "$NATIVE_TARGET"
        env:
          NATIVE_TARGET: ${{ matrix.target }}
      - name: Install Linux graphics and audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libasound2-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
      - name: Restore official embedded audio pack
        if: inputs.audio == 'official'
        shell: bash
        env:
          BSVX_AUDIO_PLAYER_GZIP_B64: ${{ secrets.BSVX_AUDIO_PLAYER_GZIP_B64 }}
          BSVX_AUDIO_ENEMY_GZIP_B64: ${{ secrets.BSVX_AUDIO_ENEMY_GZIP_B64 }}
          BSVX_AUDIO_IMPACT_GZIP_B64: ${{ secrets.BSVX_AUDIO_IMPACT_GZIP_B64 }}
        run: |
          python script/restore_release_audio.py "$RUNNER_TEMP/bsvx-audio"
          printf 'BSVX_PRIVATE_AUDIO_DIR=%s\n' "$RUNNER_TEMP/bsvx-audio" >> "$GITHUB_ENV"
      - name: Verify formatting and gameplay
        shell: bash
        run: |
          cargo fmt --all --check
          cargo test --locked --no-default-features
      - name: Check native graphics compiler warnings
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: cargo clippy --locked --target "$NATIVE_TARGET" --all-targets -- -D warnings
      - name: Build native release binary
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$NATIVE_TARGET"
      - name: Package Windows binary and notices
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/package_windows.ps1 -NoBuild
      - name: Package Linux binary and notices
        if: runner.os == 'Linux'
        run: |
          ldd target/x86_64-unknown-linux-gnu/release/battlestar_voxel
          ./script/package_linux.sh --no-build
      - name: Upload native package and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Battlestar_Voxel_Squadron_${{ matrix.platform }}_x86_64_${{ inputs.audio }}
          path: |
            dist/*_${{ matrix.platform }}_x86_64.zip
            dist/*_${{ matrix.platform }}_x86_64.zip.sha256
            dist/*_${{ matrix.platform }}_x86_64.tar.gz
            dist/*_${{ matrix.platform }}_x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
